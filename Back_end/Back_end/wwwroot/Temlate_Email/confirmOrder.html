<!DOCTYPE html>
<html lang='vi'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
        }

            .header h1 {
                color: #007bff;
            }

        .content {
            text-align: center;
        }

            .content p {
                line-height: 1.6;
            }

        .button-container {
            text-align: center;
            margin: 20px 0;
        }

        .button {
            background-color: #ff6a00;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

            .button:hover {
                background-color: #b81717;
            }
            a{
                color:aliceblue;
                font-weight:bold;
            }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class='email-container'>
        <div class='header'>
            <h1>Xác nhận đơn hàng</h1>
        </div>
        <div class='content'>
            <p>Xin chào {{Username}},</p>
            <p>Cảm ơn bạn đã đặt hàng với chúng tôi. Vui lòng xác nhận đơn hàng của bạn bằng cách nhấp vào nút dưới đây.</p>
            <div class='button-container'>
                <a href='{{callbackUrl}}' class='button'style="color:aliceblue">Xác nhận đơn hàng</a>
            </div>
        </div>
        <div class='footer'>
            <p>Trân trọng,</p>
            <p>Đội ngũ hỗ trợ khách hàng</p>
        </div>
    </div>
</body>
</html>
