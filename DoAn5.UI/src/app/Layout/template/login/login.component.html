<div class="contain">
  <p-toast></p-toast>

  <div class="Login">
    <div class="center-text">
      
      <h2  [routerLink]="['/']"><img src="/./assets/client/assets/img/snapedit_Achino.png" height="20%" width="30%" class="mr-2" /></h2>
      <small>Vui lòng nhập email và mật khẩu của bạn</small>
    </div>
    <form class="enter" [formGroup]="FormLogin">
      <span>
        <input pInputText id="email" formControlName="email"
          placeholder="Email" />
      </span>
      <span>
        <p-inputGroup>
          <input [type]="passwordFieldType" pInputText placeholder="Mật khẩu"  formControlName="passwordHash"/>
          <button type="button" pButton icon="pi pi-eye-slash" (click)="togglePasswordVisibility()" *ngIf="showPassword ==true"></button>
          <button type="button" pButton icon="pi pi-eye"  (click)="togglePasswordVisibility()"*ngIf="showPassword ==false"></button>
          </p-inputGroup>
        <!-- <input type="password" pInputText formControlName="passwordHash"
          placeholder="Password" /> -->
      </span>
      <span>
        <p-button (onClick)="login()" label="Login"></p-button>
      </span>
    </form>
    <div class="center-text" style="display: grid;">
      <span [routerLink]="['/Register']" class="forgot-password">Đăng kí</span>
      <span class="forgot-password" [routerLink]="['/FogotPassword']">Quên mật khẩu</span>
    </div>
    <div class="icons">
      <span class="pi pi-twitter" ></span>
      <span class="pi pi-whatsapp"></span>
      <span class="pi pi-google" ></span>

    </div>
    
  </div>
</div>
