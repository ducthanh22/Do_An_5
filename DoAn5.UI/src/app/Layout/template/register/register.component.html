<div class="contain">
    <div class="Login">
        <div class="center-text">
            <p-toast></p-toast>

            <h2 [routerLink]="['/']"><img src="/./assets/client/assets/img/snapedit_Achino.png" height="20%" width="30%"
                    class="mr-2" /></h2>
            <!-- <small>Vui lòng nhập email và mật khẩu của bạn</small> -->
        </div>
        <form class="enter" [formGroup]="formRegister">
            <span>
                <input pInputText id="email" placeholder="Email" formControlName="email" />
            </span>
            <span>
                <input pInputText id="userName" placeholder="Tên" formControlName="userName" />
            </span>
            <span>
                <p-inputGroup>
                    <input [type]="passwordFieldType" pInputText placeholder="Mật khẩu mới"  formControlName="passwordHash"/>
                    <button type="button" pButton icon="pi pi-eye-slash" (click)="togglePasswordVisibility()" *ngIf="showPassword ==true"></button>
                    <button type="button" pButton icon="pi pi-eye"  (click)="togglePasswordVisibility()"*ngIf="showPassword ==false"></button>
                    </p-inputGroup>
            </span>
            <span>
                <p-inputGroup>
                    <input [type]="passwordFieldType" pInputText placeholder="Nhập lại mật khẩu"  formControlName="confirmPass"/>
                    <button type="button" pButton icon="pi pi-eye-slash" (click)="togglePasswordVisibility()" *ngIf="showPassword ==true"></button>
                    <button type="button" pButton icon="pi pi-eye"  (click)="togglePasswordVisibility()"*ngIf="showPassword ==false"></button>
                    </p-inputGroup>
                    <div *ngIf="formRegister.get('confirmPass')?.invalid && formRegister.get('confirmPass')?.touched">
                        <span style="color: red;">Phải nhập khớp mật khẩu</span>
                    </div>
                    
            </span>
          
            <span>
                <input type="text" pInputText placeholder="Số điện thoại"formControlName="phoneNumber" />
            </span>
            <span>
                <input type="text" pInputText placeholder="Địa chỉ" formControlName="address" />
            </span>
            <span>
                <p-button label="Đăng kí" *ngIf="formRegister.valid" (onClick)="Register()"></p-button>
            </span>
        </form>
    </div>
</div>
