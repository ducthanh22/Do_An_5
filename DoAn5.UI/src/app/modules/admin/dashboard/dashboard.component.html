<div class="dashboard-container" *ngIf="statistical">
  <div class="card flex flex-wrap gap-3 p-fluid">
    <div class="date">
      <label for="icondisplay" class="font-bold block mb-2"> Ngày bắt đầu </label>
      <p-calendar [(ngModel)]="date1" [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay"
        class="short-calendar" />
    </div>
    <div class="date ">
      <label for="icondisplay" class="font-bold block mb-2"> Ngày kết thúc </label>
      <p-calendar [(ngModel)]="date2" [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay"
        [maxDate]="maxdate" />
    </div>
    <div class="flex">
      <p-button label="Submit" (onClick)="getDashboarsh()" />
    </div>
    <div class="flex">
      <p-button label="Reset" (onClick)="reset()" />
    </div>
  </div>
  <div class="p-flex">
    <div class="infor center-align">
      <p-card header="Đơn hàng">
        <p class="m-0 center-align">
          {{statistical.totalOrder}}
        </p>
      </p-card>
    </div>
    <div class="infor center-align">
      <p-card header="Khách hàng">
        <p class="m-0 center-align">
          {{statistical.totalCustomer}}

        </p>
      </p-card>
    </div>
    <div class="infor center-align">
      <p-card header="Số lượng sản phẩm">
        <p class="m-0 center-align">
          {{statistical.totalProduct}}

        </p>
      </p-card>
    </div>
    <div class="infor center-align">
      <p-card header="Doanh thu dự kiến">
        <p class="m-0 center-align">
          {{statistical.expected_Revenue| currency:'VND':''}}đ
        </p>
      </p-card>
    </div>
  </div>
  <!-- Lưới cho ô dưới -->
  <div class="p-flex">
    <div class="Revenue">
      <p-card header="Doanh thu theo tháng" subheader="{{statistical.totalMonthlyrevenue| currency:'VND':''}}đ">
        <ng-template pTemplate="content">
          <p-chart type="line" [data]="revenueChartData" [options]="options"></p-chart>
        </ng-template>
      </p-card>
    </div>
    <div class="infor-2">
      <p-card header="Tổng doanh thu" subheader="{{statistical.totalRevenueCategory| currency:'VND':''}}đ">
        <ng-template pTemplate="content">
          <p-chart type="pie" [data]="salesChartData"></p-chart>
        </ng-template>
      </p-card>
    </div>
    <div class="infor-2">
      <p-card header="Tỷ lệ đánh giá" subheader="{{statistical.totalRating}}">
        <ng-template pTemplate="content">
          <p-chart type="doughnut" [data]="ratingChartData" class="small-chart"></p-chart>
        </ng-template>
      </p-card>
    </div>
  </div>
  <div style="width: 90%; margin-top: 2%;margin-left: 5%;">
    <p-card header="Top 10 sản phẩm bán chạy">
      <p-table [value]="bestSellingProducts" [lazy]="true" [rows]="10" [scrollable]="true" scrollHeight="500px"
        [showCurrentPageReport]="true" [tableStyle]="{ 'min-width': '30rem' }" [resizableColumns]="true"
        [filterDelay]="0">
        <ng-template pTemplate="header">
          <tr>
            <th style="width:3%;">STT</th>
            <th>Ảnh</th>
            <th>Tên</th>
            <th>Giá</th>
            <th>Số lượng bán</th>

          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product let-rowIndex="rowIndex">
          <tr>
            <td>{{ rowIndex + 1}}</td>
            <td><p-image src="https://localhost:8443/Images/{{ product.image }}"
                previewImageSrc="https://localhost:8443/Images/{{ product.image }}" alt="Image" width="100"
                [preview]="true"></p-image></td>
            <td>{{ product.name }}</td>
            <td>{{ product.price_product}}</td>
            <td>{{ product.totalQuantity }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="paginatorleft">
          <p-button type="button" icon="pi pi-plus" styleClass="p-button-text"></p-button>
        </ng-template>
        <ng-template pTemplate="paginatorright">
          <p-button type="button" icon="pi pi-cloud" styleClass="p-button-text"></p-button>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>
